[build]
  # Build command to run
  command = "npm run build"
  
  # Directory that contains the built files
  publish = "dist/public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/age"
  to = "/.netlify/functions/age"
  status = 200

[[redirects]]
  # Redirect all routes to index.html for SPA routing
  from = "/*"
  to = "/index.html"
  status = 200
